name: ACEest Core Automation Engine v3

on:
  push:
    branches: [ "main", "Develop", "Test", "Stage" ]
  pull_request:
    branches: [ "main", "Develop", "Test", "Stage" ]

jobs:
  continuous-integration-pipeline:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository Code
      uses: actions/checkout@v4

    - name: Set up Python Environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Install Runtime Requirements
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Lint Syntax Verification Gate
      run: python -m py_compile app.py

    - name: Assemble Portable Container Image
      run: docker build -t aceest-fitness-app:${{ github.sha }} .

    - name: Execute Pytest Suite inside Environment Runner
      run: pytest test_app.py
